services:

  # ─────────────────────────────────────────────
  # INFRASTRUKTUR
  # ─────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: serp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serp-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: serp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -e \"GET /healthz HTTP/1.0\\r\\n\" > /dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - serp-net

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: serp-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - serp-net

